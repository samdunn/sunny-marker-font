name: Font quality and security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: font-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  npm-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: python3 scripts/package_npm.py
      - run: npm install --prefix build/npm-smoke ./web/downloads/sunnyai-sunny-marker-1.313.0.tgz --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify_npm.mjs build/npm-smoke
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r requirements-qa.txt
      - run: make coverage-verify
      - run: make outline-verify
      - run: make audit
      - run: python scripts/check_secrets.py
      - run: python scripts/test_outline_geometry.py
      - run: make review
      - run: make package
      - run: make verify
      - run: make check
